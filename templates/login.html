<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX Budget System — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f7f4ee;
  color: #1a1d2e;
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

/* Left — editorial brand panel */
.login-left {
  background: #1a1d2e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px;
  position: relative;
  overflow: hidden;
}
.login-left::after {
  content: 'VFX';
  position: absolute;
  right: -20px;
  bottom: -40px;
  font-family: 'Barlow Condensed', system-ui, sans-serif;
  font-size: 180px;
  font-weight: 900;
  letter-spacing: -8px;
  color: rgba(255,255,255,.04);
  pointer-events: none;
  line-height: 1;
}
.login-brand {
  font-family: 'Barlow Condensed', system-ui, sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: #c4622a;
}
.login-display {
  font-family: 'Barlow Condensed', system-ui, sans-serif;
  font-size: clamp(48px, 6vw, 80px);
  font-weight: 900;
  line-height: .9;
  letter-spacing: -2px;
  color: #fff;
}
.login-display span { color: #c4622a; }
.login-tagline {
  font-size: 13px;
  color: rgba(255,255,255,.4);
  line-height: 1.7;
  max-width: 280px;
}
.login-footer-text {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,.2);
}

/* Right — form panel */
.login-right {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  background: #f7f4ee;
}
.login-form-wrap {
  width: 100%;
  max-width: 340px;
}

.login-eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #c4622a;
  margin-bottom: 12px;
}
.login-title {
  font-family: 'Barlow Condensed', system-ui, sans-serif;
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -1px;
  color: #1a1d2e;
  line-height: 1;
  margin-bottom: 32px;
}

.login-rule {
  height: 1px;
  background: #d8d2c6;
  margin-bottom: 28px;
}

label.login-label {
  display: block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #7a7468;
  margin-bottom: 8px;
}
input.login-input {
  width: 100%;
  background: #fff;
  border: 1px solid #d8d2c6;
  border-radius: 5px;
  color: #1a1d2e;
  padding: 11px 14px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  margin-bottom: 20px;
}
input.login-input:focus {
  border-color: #c4622a;
  box-shadow: 0 0 0 3px rgba(196,98,42,.1);
}
input.login-input::placeholder { color: #c4bcb0; }

button.login-btn {
  width: 100%;
  background: #1a1d2e;
  color: #fff;
  border: none;
  border-radius: 5px;
  padding: 13px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: .8px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
button.login-btn:hover { background: #c4622a; }

.login-error {
  background: rgba(168,48,48,.08);
  border: 1px solid rgba(168,48,48,.25);
  border-left: 3px solid #a83030;
  color: #a83030;
  border-radius: 0 5px 5px 0;
  padding: 10px 14px;
  font-size: 12px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

@media (max-width: 640px) {
  body { grid-template-columns: 1fr; }
  .login-left { display: none; }
  .login-right { padding: 32px 24px; }
}
</style>
</head>
<body>

<!-- LEFT — brand panel -->
<div class="login-left">
  <div class="login-brand">VFX Budget System</div>

  <div>
    <div class="login-display">
      Season<br><span>Budget</span><br>Control
    </div>
    <p class="login-tagline" style="margin-top:20px;">
      Shot tracking, vendor management, budget forecasting — all in one place.
    </p>
  </div>

  <div class="login-footer-text">Production Intelligence Platform</div>
</div>

<!-- RIGHT — form -->
<div class="login-right">
  <div class="login-form-wrap">
    <div class="login-eyebrow">Secure Access</div>
    <h1 class="login-title">Sign In</h1>
    <div class="login-rule"></div>

    {% if error %}
    <div class="login-error">
      <i class="bi bi-exclamation-triangle"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="post">
      <label class="login-label" for="password">Password</label>
      <input id="password" type="password" name="password"
             class="login-input" autofocus autocomplete="current-password"
             placeholder="Enter your password">
      <button type="submit" class="login-btn">
        <i class="bi bi-box-arrow-in-right"></i>
        Sign In
      </button>
    </form>
  </div>
</div>

</body>
</html>
