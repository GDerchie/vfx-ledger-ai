{% extends "base.html" %}
{% block title %}VFX Notes{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3 gap-3">
  <h5 class="mb-0 text-warning fw-bold"><i class="bi bi-journal-text me-2"></i>VFX NOTES</h5>
  <button class="ai-btn ms-2" onclick="openSummarizeModal()"
          style="font-size:12px;padding:3px 12px;" title="AI summarize all open notes">
    ✨ Summarize
  </button>
  <button class="btn-vfx btn-vfx-blue ms-auto" onclick="addNote()">
    <i class="bi bi-plus me-1"></i>Add Note
  </button>
</div>

<!-- AI Summarize Modal -->
<div class="modal fade" id="summarizeModal" tabindex="-1">
  <div class="modal-dialog modal-lg" style="margin-top:80px;">
    <div class="modal-content" style="background:#0d0e18;border:1px solid #2e3050;">
      <div class="modal-header" style="background:#12152a;border-bottom:1px solid #2e3050;padding:10px 16px;">
        <div>
          <span style="font-size:13px;font-weight:700;color:#f0b429;">✨ AI — Summarize Open Notes</span>
          <div style="font-size:10px;color:#4a5080;margin-top:2px;">Condenses open notes into a prioritised action list</div>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:16px 20px;">
        <div id="sum-note-count" style="font-size:11px;color:#6870a0;margin-bottom:12px;"></div>
        <button class="ai-btn" id="sum-gen-btn" onclick="summarizeGenerate()"
                style="font-size:12px;padding:4px 14px;">✨ Generate Summary</button>
        <div class="ai-preview" id="sum-preview"
             style="margin-top:10px;max-height:340px;white-space:pre-wrap;font-size:12px;line-height:1.7;"></div>
        <div class="ai-actions" id="sum-actions" style="margin-top:10px;">
          <button class="ai-accept" onclick="summarizeCopy()">
            <i class="bi bi-clipboard me-1"></i>Copy
          </button>
          <button class="ai-discard" onclick="summarizeDiscard()">Discard</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="vfx-panel">
  <div class="vfx-panel-header">
    <span>ALL NOTES</span>
    <span class="text-muted" style="font-size:10px;">Click cells to edit • check Resolved to mark done</span>
  </div>
  <div class="vfx-panel-body p-0">
    <div id="notes-table" style="min-height:400px;"></div>
  </div>
</div>

<div class="vfx-toast" id="toast"></div>
{% endblock %}

{% block scripts %}
<script>
let notesTable = null;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',2000);
}

function buildTable(data){
  if(notesTable){ notesTable.destroy(); notesTable=null; }
  notesTable = new Tabulator('#notes-table',{
    ...TABULATOR_PERF,
    data, layout:'fitDataFill', height:'500px',
    rowFormatter: row => {
      if(row.getData().resolved)
        row.getElement().style.opacity='0.5';
    },
    columns:[
      { title:'#', field:'item_num', width:55, hozAlign:'center' },
      { title:'Author', field:'author', width:100, editor:'input', cellEdited:save },
      { title:'VFX Note', field:'note_text', width:500, editor:'textarea', formatter:'textarea', cellEdited:save },
      { title:'Date', field:'note_date', width:110, editor:'input', cellEdited:save },
      { title:'Resolved', field:'resolved', width:80, hozAlign:'center',
        formatter:'tickCross', editor:'tickCross',
        cellEdited: cell=>{
          save(cell);
          const row=cell.getRow();
          if(cell.getValue()) row.getElement().style.opacity='0.5';
          else row.getElement().style.opacity='1';
        }},
      { title:'', width:40, hozAlign:'center', headerSort:false,
        formatter:()=>'<i class="bi bi-trash" style="color:#e05252;cursor:pointer;"></i>',
        cellClick:(e,cell)=>del(cell.getRow()) }
    ]
  });
}

async function save(cell){
  const row = cell.getRow().getData();
  if(!row.id) return;
  await fetch(`/api/notes/${row.id}`,{
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({[cell.getField()]: cell.getValue()})
  });
  toast('Saved');
}

async function addNote(){
  const res = await fetch('/api/notes',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({note_text:''})
  });
  const data = await res.json();
  const rows = notesTable.getData();
  notesTable.addRow({
    id:data.id, item_num:rows.length+1,
    author:'', note_text:'', note_date:new Date().toISOString().slice(0,10), resolved:false
  });
  toast('Note added');
}

async function del(row){
  if(!confirm('Delete this note?')) return;
  await fetch(`/api/notes/${row.getData().id}`,{method:'DELETE'});
  row.delete();
  toast('Deleted');
}

// ── AI Summarize ──────────────────────────────────────────────────────────────
let _sumModal = null;

function openSummarizeModal() {
  if (!_sumModal)
    _sumModal = new bootstrap.Modal(document.getElementById('summarizeModal'));

  const allNotes  = notesTable ? notesTable.getData() : [];
  const openNotes = allNotes.filter(n => !n.resolved && (n.note_text||'').trim());
  document.getElementById('sum-note-count').textContent =
    `${openNotes.length} open note${openNotes.length !== 1 ? 's' : ''} (resolved notes excluded)`;

  // reset UI
  const prev = document.getElementById('sum-preview');
  const acts = document.getElementById('sum-actions');
  const btn  = document.getElementById('sum-gen-btn');
  prev.style.display = 'none'; prev.textContent = '';
  acts.style.display = 'none';
  btn.disabled = false; btn.innerHTML = '✨ Generate Summary';

  _sumModal.show();
}

async function summarizeGenerate() {
  const btn     = document.getElementById('sum-gen-btn');
  const prev    = document.getElementById('sum-preview');
  const acts    = document.getElementById('sum-actions');
  btn.disabled  = true; btn.innerHTML = '✨ Analysing…';
  prev.style.display = 'none'; prev.textContent = '';
  acts.style.display = 'none';

  try {
    const res  = await fetch('/api/llm/notes_summarize', { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: '{}' });
    const data = await res.json();
    if (data.error) { prev.textContent = `Error: ${data.error}`; prev.style.display = 'block'; return; }

    let html = '';
    if (data.summary) {
      html += `<div style="margin-bottom:10px;font-size:12px;color:#d0d8f0;line-height:1.6;">
        ${data.summary}</div>`;
    }
    if (data.priorities && data.priorities.length) {
      html += `<div style="font-size:10px;font-weight:700;color:#f0b429;letter-spacing:.5px;
               margin-bottom:6px;">TOP ACTION PRIORITIES</div>`;
      html += data.priorities.map(p =>
        `<div style="display:flex;gap:8px;margin-bottom:4px;">
           <span style="color:#e05252;font-weight:700;margin-top:1px;">▸</span>
           <span style="font-size:11px;color:#d0d8f0;">${p}</span>
         </div>`
      ).join('');
    }
    if (data.unresolved_count !== undefined) {
      html += `<div style="font-size:9px;color:#4a5080;margin-top:8px;">
        ${data.unresolved_count} unresolved notes</div>`;
    }
    prev.innerHTML = html;
    prev.style.display = 'block';
    acts.style.display = 'flex';
  } catch(e) {
    prev.textContent = `Error: ${e}`; prev.style.display = 'block';
  } finally {
    btn.disabled = false; btn.innerHTML = '✨ Generate Summary';
  }
}

function summarizeCopy() {
  const text = document.getElementById('sum-preview').textContent.trim();
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
}

function summarizeDiscard() {
  const prev = document.getElementById('sum-preview');
  const acts = document.getElementById('sum-actions');
  const btn  = document.getElementById('sum-gen-btn');
  prev.style.display = 'none'; prev.textContent = '';
  acts.style.display = 'none';
  btn.disabled = false; btn.innerHTML = '✨ Generate Summary';
}

async function init(){
  const res = await fetch('/api/notes');
  buildTable(await res.json());
}
init();
</script>
{% endblock %}
